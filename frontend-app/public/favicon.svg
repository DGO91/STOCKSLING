<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 46" fill="none" width="48" height="46">
  <defs>
    <!-- Degradado principal del rayo: Púrpura -> Cian -> Azul -->
    <linearGradient id="rayo-gradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Degradado de brillo interno translúcido (Efecto Cristal/Volumen) -->
    <linearGradient id="brillo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Sombra suave para separar el rayo del fondo en cualquier color -->
    <filter id="rayo-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#863bff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Grupo con filtro de brillo sutil -->
  <g filter="url(#rayo-glow)">
    <!-- Base del Rayo con el degradado tricolor oficial -->
    <path 
      d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" 
      fill="url(#rayo-gradient)"
    />

    <!-- Capa superior de Brillo (Efecto 3D de la derecha) -->
    <path 
      d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" 
      fill="url(#brillo-gradient)"
      opacity="0.85"
    />
  </g>
</svg>